<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#24232A;text-decoration:none}a:hover{color:#B23A30}
input::placeholder{color:#6B6760}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3EEE3; color: #24232A; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 24px 20px 0; display: flex; align-items: flex-end; justify-content: space-between">
    <div>
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 34px; line-height: 1.05">Margins</h1>
      <p style="margin: 4px 0 0; font-size: 14px; color: #6B6760">23 pages · 31 memos</p>
    </div>
    <a href="Exercises.dc.html" aria-label="New page" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #24232A; display: flex; align-items: center; justify-content: center; background: #FBF8F1">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#24232A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    </a>
  </div>

  <div style="padding: 14px 16px 0">
    <label for="nb-search" style="height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #FBF8F1; border: 1px solid #D8CDB6; border-radius: 6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6760" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="nb-search" type="search" placeholder="Search lyrics, words, memos" style="flex-grow: 1; border: 0; background: transparent; font: 16px Inter, sans-serif; color: #24232A; outline: none; min-width: 0">
    </label>
  </div>

  <div style="padding: 12px 16px 0; display: flex; gap: 8px; overflow-x: auto">
    <sc-for list="{{chips}}" as="ch" hint-placeholder-count="5">
      <button onClick="{{ch.pick}}" style="{{ch.style}}">{{ch.label}}</button>
    </sc-for>
  </div>

  <div style="flex-grow: 1; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{pages}}" as="pg" hint-placeholder-count="5">
      <a href="{{pg.href}}" style="background: #FBF8F1; border-radius: 4px; padding: 11px 14px 10px; display: flex; flex-direction: column; gap: 3px; box-shadow: 0 1px 0 rgba(36,35,42,0.06), 0 4px 12px rgba(80,60,30,0.08); border-left: 0">
        <span style="font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 14.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{pg.first}}</span>
        <span style="font-family: 'Courier Prime', monospace; font-size: 13px; line-height: 1.35; color: #6B6760; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{pg.second}}</span>
        <span style="display: flex; align-items: center; gap: 10px; margin-top: 3px; font-size: 12.5px; color: #6B6760">
          <span style="font-family: Caveat, cursive; font-weight: 700; font-size: 18px; color: #B23A30; line-height: 1">{{pg.tag}}</span>
          <span>{{pg.date}}</span>
          <span style="margin-left: auto; display: flex; align-items: center; gap: 4px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6760" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path></svg>
            {{pg.memos}}
          </span>
        </span>
      </a>
    </sc-for>
  </div>

  <div style="height: 92px; flex-shrink: 0; background: #ECE5D6; border-top: 1px solid #D8CDB6; display: flex; align-items: center; justify-content: space-around; padding: 0 12px 8px">
    <a href="Notebook.dc.html" aria-current="page" style="width: 88px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; color: #B23A30">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B23A30" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"></path><path d="M5 17a2 2 0 0 1 2-2h12"></path><path d="M9 7h6"></path></svg>
      Notebook
    </a>
    <a href="ObjectWriting.dc.html" aria-label="Record a voice memo" style="width: 66px; height: 66px; border-radius: 33px; background: #B23A30; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px #F3EEE3, 0 0 0 6px #D8CDB6, 0 6px 14px rgba(178,58,48,0.35); margin-top: -22px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
    </a>
    <a href="Exercises.dc.html" style="width: 88px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#24232A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
      Exercises
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'All' };
  }
  renderVals() {
    const all = [
      { first: 'Headlights crawl across the porch', second: 'I burned your static for the heat', tag: 'Word grid', date: 'Today', memos: '2', href: 'Main.dc.html' },
      { first: 'Plastic sweating on the dresser', second: 'The hum down the hall holds a B flat', tag: 'Object writing', date: 'Nov 21', memos: '1', href: 'ObjectWriting.dc.html' },
      { first: 'You paid in quarters, didn’t look up', second: 'The pump clicked off at nine eighty-two', tag: 'Constraint dice', date: 'Nov 18', memos: '0', href: 'Main.dc.html' },
      { first: 'The porch confesses everything', second: 'The fence forgets my name by June', tag: 'Word ladder', date: 'Nov 15', memos: '3', href: 'Main.dc.html' },
      { first: 'Half a map and a borrowed coat', second: 'We drove like the radio owed us', tag: 'Cut-up', date: 'Nov 12', memos: '1', href: 'Main.dc.html' }
    ];
    const f = this.state.filter;
    const labels = ['All', 'Word grid', 'Object writing', 'Word ladder', 'Cut-up', 'Constraint dice'];
    const chips = labels.map((l) => ({
      label: l,
      pick: () => this.setState({ filter: l }),
      style: 'flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; font: 500 13.5px Inter, sans-serif; cursor: pointer; ' + (l === f ? 'background: #24232A; color: #FBF8F1; border: 1px solid #24232A;' : 'background: transparent; color: #24232A; border: 1px solid #B9AE96;')
    }));
    const pages = f === 'All' ? all : all.filter((p) => p.tag === f);
    return { chips, pages };
  }
}
</script>
</body>
</html>
