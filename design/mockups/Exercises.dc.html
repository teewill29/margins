<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exercise picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#24232A;text-decoration:none}a:hover{color:#B23A30}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3EEE3; color: #24232A; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 24px 20px 0">
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 32px; line-height: 1.05">Exercises</h1>
    <p style="margin: 6px 0 0; font-size: 15px; color: #6B6760">Pick one to start a new page.</p>
  </div>

  <div style="padding: 14px 16px 0">
    <a href="Main.dc.html" style="height: 48px; border: 1.5px solid #24232A; border-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; background: #FBF8F1">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B23A30" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="8.5" cy="8.5" r="1.2" fill="#B23A30"></circle><circle cx="15.5" cy="15.5" r="1.2" fill="#B23A30"></circle><circle cx="12" cy="12" r="1.2" fill="#B23A30"></circle></svg>
      Surprise me
    </a>
  </div>

  <div style="flex-grow: 1; padding: 16px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="10">
      <a href="{{c.href}}" style="{{c.style}}">
        <span style="font-family: Caveat, cursive; font-weight: 700; font-size: 22px; line-height: 1; color: #B23A30">{{c.name}}</span>
        <span style="font-size: 13px; line-height: 1.35; color: #3E3C40">{{c.desc}}</span>
        <span style="margin-top: auto; font-family: 'Courier Prime', monospace; font-size: 12px; color: #6B6760">{{c.meta}}</span>
      </a>
    </sc-for>
  </div>

  <div style="height: 92px; flex-shrink: 0; background: #ECE5D6; border-top: 1px solid #D8CDB6; display: flex; align-items: center; justify-content: space-around; padding: 0 12px 8px">
    <a href="Notebook.dc.html" style="width: 88px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#24232A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"></path><path d="M5 17a2 2 0 0 1 2-2h12"></path><path d="M9 7h6"></path></svg>
      Notebook
    </a>
    <a href="ObjectWriting.dc.html" aria-label="Record a voice memo" style="width: 66px; height: 66px; border-radius: 33px; background: #B23A30; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px #F3EEE3, 0 0 0 6px #D8CDB6, 0 6px 14px rgba(178,58,48,0.35); margin-top: -22px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
    </a>
    <a href="Exercises.dc.html" aria-current="page" style="width: 88px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; color: #B23A30">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B23A30" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
      Exercises
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['Word grid', '16 words. Use every one.', 'last: today', 'Main.dc.html'],
      ['Word ladder', 'Nouns meet verbs. Pair the odd ones.', 'last: Nov 15', 'Main.dc.html'],
      ['Object writing', 'One object, seven senses, ten minutes.', 'last: Nov 21', 'ObjectWriting.dc.html'],
      ['Cut-up', 'Paste a text. Chop it. Rearrange.', 'last: Nov 12', 'Main.dc.html'],
      ['First line', 'Start from a line you didn’t write.', 'never tried', 'Main.dc.html'],
      ['Last line', 'Write toward an ending.', 'never tried', 'Main.dc.html'],
      ['Title first', 'Earn the title by the chorus.', 'last: Oct 30', 'Main.dc.html'],
      ['Constraint dice', 'POV, tense, place, one banned word.', 'last: Nov 18', 'Main.dc.html'],
      ['Character', 'A person, a want, an obstacle.', 'last: Nov 3', 'Main.dc.html'],
      ['Free page', 'No prompt. Just write.', 'last: Nov 9', 'Main.dc.html']
    ];
    const tilt = [-0.6, 0.5, 0.3, -0.4, 0.6, -0.3, -0.5, 0.4, 0.2, -0.6];
    const cards = list.map((r, i) => ({
      name: r[0], desc: r[1], meta: r[2], href: r[3],
      style: 'min-height: 98px; box-sizing: border-box; background: #FBF8F1; border-radius: 4px; padding: 10px 12px 9px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 0 rgba(36,35,42,0.06), 0 4px 12px rgba(80,60,30,0.09); transform: rotate(' + tilt[i] + 'deg);'
    }));
    return { cards };
  }
}
</script>
</body>
</html>
